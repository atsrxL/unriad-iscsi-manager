name: Build Unraid plugin release

on:
  push:
    branches: [main]
    paths:
      - 'VERSION'
      - 'src/**'
      - 'plugin/**'
      - 'scripts/build-release.sh'
      - '.github/workflows/release.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: unraid-plugin-release
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Lint PHP and shell sources
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            php -l "$file"
          done < <(find src -type f \( -name '*.php' -o -name '*.page' \) -print0)
          while IFS= read -r -d '' file; do
            bash -n "$file"
          done < <(find src scripts -type f -name '*.sh' -print0)

      - name: Smoke test tabs, sessions, and auto-UNMAP policy
        run: |
          set -euo pipefail
          parent='src/usr/local/emhttp/plugins/unraid-iscsi-manager/unraid-iscsi-manager.page'
          sessions='src/usr/local/emhttp/plugins/unraid-iscsi-manager/scripts/iscsi-sessions.sh'
          policy='src/usr/local/emhttp/plugins/unraid-iscsi-manager/scripts/iscsi-unmap-policy.sh'
          grep -qx 'Type="xmenu"' "$parent"
          grep -qx 'Tabs="true"' "$parent"

          mkdir -p /tmp/izm-test-bin
          cat > /tmp/izm-test-bin/targetcli <<'EOF'
          #!/bin/bash
          cat <<'OUT'
          alias: WIN-GAME sid: 7 type: Normal session-state: LOGGED_IN
              name: iqn.1991-05.com.microsoft:win-game
              mapped-lun: 0 backstore: block/iscsi mode: rw
              address: 192.168.123.25 (TCP)  cid: 0 connection-state: LOGGED_IN
          OUT
          EOF
          chmod +x /tmp/izm-test-bin/targetcli
          PATH="/tmp/izm-test-bin:$PATH" TARGET_ISCSI_ROOT=/tmp/does-not-exist bash "$sessions" > /tmp/izm-sessions.tsv
          grep -F $'7\tWIN-GAME\tiqn.1991-05.com.microsoft:win-game\tLOGGED_IN\tLOGGED_IN\t192.168.123.25\tTCP\t0\t/backstores/block/iscsi\trw' /tmp/izm-sessions.tsv

          # targetcli can omit demo-mode sessions. Verify the configfs fallback.
          cat > /tmp/izm-test-bin/targetcli <<'EOF'
          #!/bin/bash
          exit 0
          EOF
          cat > /tmp/izm-test-bin/ss <<'EOF'
          #!/bin/bash
          echo '0 0 10.0.0.1:3260 192.168.123.25:50123'
          EOF
          chmod +x /tmp/izm-test-bin/targetcli /tmp/izm-test-bin/ss
          root='/tmp/izm-config/iqn.2003-01.org.linux-iscsi.qnas.test/tpgt_1'
          mkdir -p "$root/np/0.0.0.0:3260"
          echo 'iqn.1991-05.com.microsoft:win-game' > "$root/dynamic_sessions"
          PATH="/tmp/izm-test-bin:$PATH" TARGET_ISCSI_ROOT=/tmp/izm-config bash "$sessions" > /tmp/izm-dynamic.tsv
          grep -F $'dynamic\t\tiqn.1991-05.com.microsoft:win-game\tLOGGED_IN\tLOGGED_IN\t192.168.123.25\tTCP\t\t\trw\tiqn.2003-01.org.linux-iscsi.qnas.test\ttpg1' /tmp/izm-dynamic.tsv

          # Auto-UNMAP must only touch mapped block backstores that resolve to
          # ZVOLs and are not already reporting UNMAP=on.
          mkdir -p /tmp/izm-policy
          cat > /tmp/izm-policy/map.sh <<'EOF'
          #!/bin/bash
          printf '%s\n' \
            $'iqn.test\ttpg1\tLun0\t/backstores/block/iscsi\t/dev/zvol/tank/games\tdefault_tg_pt_gp\ttank/games\toff' \
            $'iqn.test\ttpg1\tLun1\t/backstores/block/rawdisk\t/dev/sdb\tdefault_tg_pt_gp\t\toff' \
            $'iqn.test\ttpg1\tLun2\t/backstores/block/ready\t/dev/zvol/tank/ready\tdefault_tg_pt_gp\ttank/ready\ton'
          EOF
          cat > /tmp/izm-policy/unmap.sh <<'EOF'
          #!/bin/bash
          printf '%s\n' "$*" >> /tmp/izm-policy/calls
          EOF
          chmod +x /tmp/izm-policy/map.sh /tmp/izm-policy/unmap.sh
          echo 'AUTO_UNMAP=1' > /tmp/izm-policy/settings.cfg
          : > /tmp/izm-policy/calls
          IZM_MAP_SCRIPT=/tmp/izm-policy/map.sh \
          IZM_UNMAP_SCRIPT=/tmp/izm-policy/unmap.sh \
          IZM_CONFIG_FILE=/tmp/izm-policy/settings.cfg \
          IZM_UNMAP_LOCK=/tmp/izm-policy/lock \
          bash "$policy"
          grep -Fx 'set /backstores/block/iscsi on' /tmp/izm-policy/calls
          test "$(wc -l < /tmp/izm-policy/calls)" -eq 1

          # Disabled policy must perform no mutation.
          echo 'AUTO_UNMAP=0' > /tmp/izm-policy/settings.cfg
          : > /tmp/izm-policy/calls
          IZM_MAP_SCRIPT=/tmp/izm-policy/map.sh \
          IZM_UNMAP_SCRIPT=/tmp/izm-policy/unmap.sh \
          IZM_CONFIG_FILE=/tmp/izm-policy/settings.cfg \
          IZM_UNMAP_LOCK=/tmp/izm-policy/lock2 \
          bash "$policy"
          test ! -s /tmp/izm-policy/calls

      - name: Build plugin assets
        run: bash ./scripts/build-release.sh

      - name: Validate generated plugin XML
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libxml2-utils
          xmllint --noout dist/unraid-iscsi-manager.plg

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)"
          TAG="$VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release delete "$TAG" --cleanup-tag -y
          fi
          gh release create "$TAG" \
            dist/unraid-iscsi-manager.plg \
            "dist/unraid-iscsi-manager-${VERSION}.txz" \
            --target "$GITHUB_SHA" \
            --title "iSCSI ZVOL Manager ${VERSION}" \
            --notes "Automated Unraid plugin release for ${VERSION}. Install using the unraid-iscsi-manager.plg asset."
